<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator App UI</title>
    <style>
        /* (Keep exactly the same CSS from the previous step here) */
        :root {
            --bg-dark: #202124;
            --bg-card: #3c3c40;
            --text-light: #e8eaed;
            --accent-pink: #ff2a7a;
            --accent-yellow: #fbbc04;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background-color: var(--bg-dark);
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 24px;
            font-size: 20px;
            font-weight: 600;
        }

        .text-area-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .text-area {
            width: 100%;
            height: 160px;
            background-color: var(--bg-card);
            border: none;
            border-radius: var(--border-radius);
            padding: 16px;
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        .copy-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background-color: var(--accent-yellow);
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .copy-btn svg { width: 18px; height: 18px; stroke: white; }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-select {
            background-color: var(--bg-card);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            width: 110px;
            cursor: pointer;
            appearance: none;
            outline: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
        }

        .swap-btn {
            background-color: var(--accent-pink);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .swap-btn svg { width: 22px; height: 22px; stroke: white; }

        .translate-btn {
            width: 100%;
            background-color: var(--accent-pink);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 18px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 4px;
        }
        .translate-btn:hover { background-color: #e6206b; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">Translator</div>

        <!-- We wrap the app in a form so it can send data to Python -->
        <form method="POST" action="/">
            
            <!-- Input Area -->
            <div class="text-area-wrapper">
                <!-- Added name="input_text" and {{ input_text }} to keep text after submitting -->
                <textarea class="text-area" name="input_text" placeholder="Enter text...">{{ input_text }}</textarea>
                <button type="button" class="copy-btn" aria-label="Copy text">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>

            <!-- Controls -->
            <div class="controls">
                <!-- Added name="source_lang" -->
                <select class="lang-select" name="source_lang">

                    <option value="en" {% if source_lang == 'en' %}selected{% endif %}>English</option>
                    <option value="it" {% if source_lang == 'it' %}selected{% endif %}>Italian</option>
                    <option value="es" {% if source_lang == 'es' %}selected{% endif %}>Spanish</option>
                </select>

                <button type="button" class="swap-btn" aria-label="Swap languages">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 1l4 4-4 4"></path>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                        <path d="M7 23l-4-4 4-4"></path>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                </button>

                <!-- Added name="target_lang" -->
                <select class="lang-select" name="target_lang">
                    <option value="en" {% if target_lang == 'en' %}selected{% endif %}>English</option>
                    <option value="it" {% if target_lang == 'it' %}selected{% endif %}>Italian</option>
                    <option value="es" {% if target_lang == 'es' %}selected{% endif %}>Spanish</option>
                </select>
            </div>

            <!-- Output Area -->
            <div class="text-area-wrapper">
                <!-- Added {{ translated_text }} to display the result from Python -->
                <textarea class="text-area" readonly>{{ translated_text }}</textarea>
                <button type="button" class="copy-btn" aria-label="Copy translation">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>

            <!-- Action Button (must be type="submit") -->
            <button class="translate-btn" type="submit">Translate</button>
        </form>
    </div>

</body>
</html>
